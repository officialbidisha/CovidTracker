<div class="container">
  <div class="heading" style="text-align:center">

    <a routerLink="/" routerLinkActive="active"><h2 style="display:inline-block" class="display-2">Covid Tracker &nbsp;&nbsp;&nbsp;</h2></a>
    <a routerLink="/search" routerLinkActive="active"><span class="material-icons" style="font-size: 40px;">
      search
      </span></a>
      <a class="table-icon" routerLink="/cases-summary"  matTooltip="Summary"><span class="material-icons">
        table_view
        </span></a>
     <div class="data-notice" role="status">
      @if (asOf$ | async; as asOf) {
        Showing the last published figures, as of <strong>{{ asOf | date: "MMM d, y" }}</strong>.
        Global COVID-19 reporting by Johns Hopkins ended on that date, so newer numbers are not available from this source.
      } @else {
        Checking data date…
      }
    </div>
  </div>
</div>

<div class="container">
<router-outlet></router-outlet>
</div>
